<!DOCTYPE html>
<html lang="nl" class="locked"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Jaarplan 2027 – Bertha Baas</title>
<style>
:root{
  --ink:#162729; --ink2:#22383b; --blue:#CFD7DA; --blue-d:#b9c5c9; --beige:#F2EEE8; --beige-d:#e4ddd2;
  --terra:#A75839; --terra-l:#DCAB98; --sky:#99C0D3; --paper:#FBFAF7; --white:#fff; --good:#DCEBD3;
  --muted:#5d6b6d; --line:#dfd9cf; --side:236px;
  --hand:"Segoe Print","Bradley Hand","Kalam","Comic Sans MS",cursive;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--paper);font-size:15px;line-height:1.5}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
a{color:var(--terra)}

/* ---------- wachtwoord ---------- */
#gate{display:none;position:fixed;inset:0;z-index:50;background:var(--ink);align-items:center;justify-content:center;padding:20px}
.locked #gate{display:flex}
.locked #app{display:none}
.gatebox{background:var(--paper);border-radius:18px;padding:36px 32px;width:100%;max-width:420px;text-align:center}
.gatebox img{width:100%;max-width:280px;height:auto}
.gatebox h1{font-family:var(--hand);font-size:30px;margin:18px 0 6px}
.gatebox p{color:var(--muted);margin:0 0 18px}
.gatebox input{width:100%;padding:12px 14px;border:1px solid var(--blue-d);border-radius:10px;background:var(--blue);font:inherit;text-align:center}
.gatebox button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--terra);color:#fff;font-weight:600}
.gatebox .err{color:var(--terra);min-height:22px;margin-top:10px;font-size:14px}

/* ---------- layout ---------- */
#app{display:flex;min-height:100%}
#side{width:var(--side);flex:0 0 var(--side);background:var(--ink);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:26px 22px 18px;border-bottom:1px solid #2c4245}
.brand b{display:block;letter-spacing:.32em;font-size:17px;font-weight:500}
.brand span{display:block;letter-spacing:.2em;font-size:9.5px;opacity:.7;margin-top:4px}
.brand em{display:block;font-style:normal;font-family:var(--hand);font-size:20px;margin-top:14px;color:var(--sky)}
nav{padding:14px 12px;flex:1}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#d5dedf;padding:10px 12px;border-radius:10px;font-size:15px}
nav button:hover{background:var(--ink2);color:#fff}
nav button.on{background:var(--beige);color:var(--ink);font-weight:600}
nav button i{font-style:normal;font-size:11px;letter-spacing:.05em;opacity:.65;width:20px}
nav .sub{margin:2px 0 8px 30px;border-left:1px solid #34494c;padding-left:6px;display:none}
nav .sub.open{display:block}
nav .sub button{padding:6px 10px;font-size:13.5px}
nav .sub button.on{background:none;color:var(--sky);font-weight:600}
.tools{padding:14px 14px 18px;border-top:1px solid #2c4245}
.tools .dl{width:100%;background:var(--terra);color:#fff;border:0;border-radius:10px;padding:11px 12px;font-weight:600}
.tools .dl:hover{filter:brightness(1.08)}
.tools .row{display:flex;gap:8px;margin-top:8px}
.tools .row button{flex:1 1 0;min-width:0;background:none;border:1px solid #3a5154;color:#d5dedf;border-radius:8px;padding:7px 6px;font-size:12.5px}
.tools .row button:hover{background:var(--ink2)}
.tools .save{font-size:12px;color:#a9b8ba;margin-top:10px;line-height:1.35}
.tools .save.warn{color:var(--terra-l)}
main{flex:1;min-width:0;padding:26px 24px 80px}
.wrap{max-width:1180px;margin:0 auto}
.wrap.wide{max-width:1500px}

.hero{background:var(--ink);color:#fff;border-radius:18px;padding:26px 32px;margin-bottom:22px}
.hero h1{font-family:var(--hand);font-weight:500;font-size:clamp(24px,3.4vw,38px)}
.hero p{margin:6px 0 0;opacity:.8}
.hint{display:inline-block;background:var(--blue);padding:7px 14px;border-radius:8px;font-style:italic;color:#3d4c4f;margin-bottom:18px;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:20px}
.card h2{font-size:18px;margin-bottom:14px}
.card h3{font-size:15px;margin:0 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.muted{color:var(--muted)}
.lead{font-size:16.5px;max-width:760px}
.quote{font-family:var(--hand);font-size:19px;color:var(--terra);margin:18px 0}

.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:16px;padding:9px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list b{flex:0 0 150px}
.sw{flex:0 0 46px;height:38px;border-radius:8px;border:1px solid rgba(0,0,0,.08)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:16px;padding:14px 0;border-top:1px solid var(--line);align-items:flex-start}
.steps li:first-child{border-top:0}
.steps .n{flex:0 0 68px;background:var(--beige);border-radius:8px;text-align:center;padding:5px 0;font-size:13px;font-weight:600}
.steps b{display:block}
.steps button{margin-left:auto;white-space:nowrap;background:none;border:1px solid var(--blue-d);border-radius:8px;padding:6px 12px;color:var(--ink)}
.steps button:hover{background:var(--blue)}
.rules{list-style:none;padding:0;margin:0}
.rules li{padding:11px 0 11px 30px;border-top:1px solid var(--line);position:relative}
.rules li:first-child{border-top:0}
.rules li:before{content:"→";position:absolute;left:4px;color:var(--terra)}
.small{font-size:13px}
.cta{background:var(--beige);border:1px solid var(--beige-d);display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.cta div{flex:1;min-width:260px}
.btn{background:var(--terra);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:600}
.btn:hover{filter:brightness(1.08)}

/* ---------- invoer ---------- */
.in{width:100%;border:1px solid transparent;background:var(--blue);border-radius:6px;padding:6px 8px;font:inherit;color:var(--ink);text-align:right;min-width:0}
.in.tx{text-align:left}
.in:hover{border-color:var(--blue-d)}
.in:focus{outline:2px solid var(--sky);outline-offset:0;background:#e3e9eb}
.in::placeholder{color:#7c8a8d}
textarea.in{text-align:left;resize:none;overflow:hidden;min-height:90px;line-height:1.5;padding:10px 12px;display:block}
textarea.in.one{min-height:0;padding:6px 8px}
.lblwrap.top{align-items:flex-start}
.lblwrap.top>span{padding-top:6px}
select.in{text-align:left;width:auto;padding-right:26px}
.o{display:block;text-align:right;font-variant-numeric:tabular-nums}
.neg{color:var(--terra)}
.add{background:none;border:1px dashed var(--blue-d);color:var(--muted);border-radius:8px;padding:5px 12px;font-size:13px}
.add:hover{background:var(--blue);color:var(--ink);border-style:solid}
.del{flex:0 0 26px;height:26px;border-radius:6px;border:1px solid var(--terra-l);background:#fff;color:var(--terra);font-size:17px;font-weight:700;line-height:1;padding:0}
.del:hover{background:var(--terra);border-color:var(--terra);color:#fff}
.add.rem{margin-left:6px;border-color:var(--terra-l);color:var(--terra)}
.add.rem:hover{background:var(--terra);border-color:var(--terra);color:#fff}
.lblwrap{display:flex;gap:4px;align-items:center}
.info{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--terra);color:#fff;font-size:11px;font-weight:700;font-style:normal;margin-left:7px;cursor:help;position:relative;vertical-align:middle;flex:0 0 17px}
#tip{display:none;position:fixed;z-index:60;background:#fff;color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--terra);box-shadow:0 8px 26px rgba(0,0,0,.2);border-radius:8px;padding:10px 13px;width:290px;max-width:calc(100vw - 24px);font-size:13px;line-height:1.45;white-space:pre-line;text-align:left;pointer-events:none}
#tip.on{display:block}
.info:hover,.info:focus{outline:2px solid var(--terra-l);outline-offset:1px}

/* ---------- formulier-tabellen (uurtarief) ---------- */
.ft{width:100%;border-collapse:collapse}
.ft th{background:var(--ink);color:#fff;text-align:left;padding:9px 12px;font-size:14px}
.ft th:first-child{border-radius:8px 0 0 8px}.ft th:last-child{border-radius:0 8px 8px 0}
.ft th.num{text-align:right}
.ft td{padding:5px 12px;vertical-align:middle}
.ft td.v{width:150px}
.ft td.h{color:var(--muted);font-size:13px;width:42%}
.ft th{white-space:nowrap}
.ft td.l{padding-left:26px}
.ft .calc .o{background:var(--beige);border-radius:6px;padding:6px 8px}
.ft tr.tot td{font-weight:700;padding-top:10px;padding-bottom:14px}
.ft tr.tot td.l{padding-left:12px}
.ft tr.tot .o{background:var(--beige);border-radius:6px;padding:7px 8px;border-bottom:2px solid var(--ink)}
.ft tr.gap td{height:10px;padding:0}
.result{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.result div{background:var(--terra);color:#fff;border-radius:12px;padding:18px 22px}
.result span{display:block;font-size:13px;opacity:.9}
.result strong{display:block;font-size:30px;line-height:1.2;text-align:left}
.result strong .o{text-align:left}
.ucols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:20px;align-items:start}

/* ---------- brede tabellen ---------- */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
.wt{border-collapse:separate;border-spacing:0;width:100%;min-width:1190px;font-size:13.5px;table-layout:fixed}
.wt .in{padding:5px 6px}
.wt th,.wt td{padding:3px 4px;white-space:nowrap}
.wt td.num,.wt th.num{text-align:right;width:70px}
.wt .lbl{position:sticky;left:0;z-index:2;background:#fff;text-align:left;width:200px;padding-left:12px}
.wt td.pr,.wt th.pr{width:80px}
.wt tr.sec th{background:var(--ink);color:#fff;padding:9px 6px;font-weight:600}
.wt tr.sec th.lbl{background:var(--ink);padding-left:14px;font-size:15px}
.wt tr.grp td{font-weight:700;padding-top:12px;background:#fff}
.wt tr.tot td{background:var(--beige);font-weight:700;padding:8px 6px;border-top:1px solid var(--beige-d)}
.wt tr.tot td.lbl{background:var(--beige);padding-left:14px}
.wt tr.res td{background:var(--terra);color:#fff;font-weight:700;padding:10px 6px}
.wt tr.res td.lbl{background:var(--terra);padding-left:14px}
.wt tr.res .neg{color:#fff}
.wt tr.res.dark td,.wt tr.res.dark td.lbl{background:var(--ink)}
.wt tr.sp td{height:16px;background:#fff;padding:0}
.wt td.c .o{background:var(--beige);border-radius:6px;padding:6px 8px}
.wt td.t .o{background:var(--beige);border-radius:6px;padding:6px 8px;font-weight:700}
.wt td.p .o{padding:6px 8px}
.wt tr.addrow td{padding:6px 5px 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.kpi span{font-size:13px;color:var(--muted)}
.kpi strong{display:block;font-size:22px}
.kpi strong .o{text-align:left}
.kpi.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpi.dark span{color:#b8c6c8}
.kpi.dark .neg{color:var(--terra-l)}

/* ---------- maandanalyse ---------- */
.bar{background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-weight:600;margin:26px 0 14px;font-size:16px}
.mt{width:100%;border-collapse:collapse;font-size:14px}
.mt th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:right;padding:4px 6px}
.mt th:first-child,.mt th:last-child{text-align:left}
.mt td{padding:3px 6px}
.mt td.n{width:92px}
.mt td.n .o{background:var(--beige);border-radius:6px;padding:6px 8px}
.mt td.k{width:150px;white-space:nowrap}
.good .o,.o.good{background:var(--good)!important}
.bad .o,.o.bad{background:var(--terra-l)!important}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.big3 div{background:var(--ink);color:#fff;border-radius:14px;padding:20px 24px}
.big3 span{font-size:14px;opacity:.85}
.big3 strong{display:block;font-size:28px}
.big3 .o{text-align:left}
.big3 .neg{color:var(--terra-l)}
.tm{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-weight:600}
.vt{width:100%;border-collapse:collapse;font-size:14px}
.vt th{background:var(--ink);color:#fff;padding:8px 10px;text-align:right;font-size:13px;line-height:1.3}
.vt th:first-child{text-align:left;border-radius:8px 0 0 8px}.vt th:last-child{border-radius:0 8px 8px 0}
.vt td{padding:4px 6px}
.vt td.n .o{background:var(--beige);border-radius:6px;padding:6px 8px}

/* ---------- formules, selectie en optellen ---------- */
.in.fx{background-image:linear-gradient(225deg,var(--terra) 6px,transparent 6px)}
.in.err{color:var(--terra);font-weight:700}
td.sel{background:#e6f0f5!important;box-shadow:inset 0 0 0 1px var(--sky)}
td.sel .in,td.sel .o{background:#b8d4e2!important}
td.refhl .in,td.refhl .o{outline:2px dashed var(--terra);outline-offset:-2px}
.in.adjc{background:var(--beige)}
.in.adjc:focus{background:#fff}
.in.adjc.mod{background-image:linear-gradient(225deg,var(--terra) 6px,transparent 6px)}
td.copied{outline:2px dashed var(--ink);outline-offset:-2px}
.wt td.num .in{scroll-margin-left:290px}
body.selecting,body.selecting *{-webkit-user-select:none!important;user-select:none!important;cursor:cell!important}
#fxbar{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;background:var(--paper);padding:8px 0 10px;margin:-6px 0 6px}
#fxbar .addr{min-width:72px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
#fxbar .fxl{font-style:italic;color:var(--terra);font-weight:700;font-family:Georgia,serif;font-size:17px}
#fxbar .fxt{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 10px;min-height:34px;font-family:Consolas,"SFMono-Regular",Menlo,monospace;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fxbar .fxt::placeholder{color:var(--muted);font-family:"Segoe UI",system-ui,sans-serif;font-style:italic;font-size:13px}
#fxbar .fxt{color:var(--ink);outline:none}
#fxbar .fxt.calc{background:var(--beige)}
#fxbar .fxt.edit{cursor:text}
#fxbar .fxt.edit:hover{border-color:var(--blue-d)}
#fxbar .fxt.edit:focus{border-color:var(--sky);box-shadow:0 0 0 2px var(--sky)}
#fxbar .tag{font-size:12px;color:var(--muted);min-width:78px}
#sumbar{position:fixed;right:18px;bottom:18px;z-index:40;display:none;align-items:baseline;gap:8px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px 10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13px}
#sumbar.on{display:flex}
#sumbar .l{opacity:.75}
#sumbar b{font-size:18px;margin-right:10px;font-variant-numeric:tabular-nums}
#sumbar b.s{font-size:14px}
#sumbar button{align-self:center;background:var(--beige);color:var(--ink);border:0;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600}
#sumbar button.x{background:none;color:#fff;font-size:18px;padding:0 4px;line-height:1}
.wt tr.sub td{background:#f7f4ef;font-weight:600;padding:6px;border-top:1px solid var(--beige-d)}
.wt tr.sub td.lbl{background:#f7f4ef;padding-left:14px}
.tools .dl2{width:100%;margin-top:8px;background:var(--beige);color:var(--ink);border:0;border-radius:10px;padding:9px 12px;font-weight:600}
.tools .dl2:hover{filter:brightness(1.05)}
.tools .save .mini{display:block;width:100%;margin-top:7px;background:var(--sky);color:var(--ink);border:0;border-radius:8px;padding:7px 8px;font-size:12.5px;font-weight:600;line-height:1.3}
.tools .save .mini.ghost{background:none;border:1px solid #3a5154;color:#a9b8ba;font-weight:400}
.tools .save .warn{color:var(--terra-l)}
.tools .save{margin-top:0;margin-bottom:4px}
.tools .save b{color:#fff;font-weight:600;overflow-wrap:anywhere}
.tools .save .mini.go{background:var(--terra);color:#fff}
.printmenu{margin-top:8px;background:var(--ink2);border:1px solid #3a5154;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:5px}
.printmenu[hidden]{display:none}
#bkrow[hidden]{display:none}
#browserwarn{max-width:1180px;margin:0 auto 18px;background:#fbe9e2;border:1px solid var(--terra-l);border-left:5px solid var(--terra);border-radius:12px;padding:14px 44px 14px 18px;position:relative;font-size:14.5px}
#browserwarn b{color:var(--terra)}
#browserwarn p{margin:4px 0 0}
#browserwarn .x{position:absolute;top:8px;right:10px;background:none;border:0;font-size:20px;color:var(--muted);line-height:1;padding:4px}
.printmenu span{font-size:12px;color:#a9b8ba;padding:0 2px 2px}
.printmenu button{background:none;border:1px solid #3a5154;color:#fff;border-radius:8px;padding:7px 9px;font-size:13px;text-align:left}
.printmenu button:hover{background:var(--terra);border-color:var(--terra)}
#fscard .btn{margin:4px 8px 0 0}
#fscard .btn.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}
.wt .in,.ft .in,.mt .in,.vt .in{scroll-margin-top:80px}

@media (max-width:980px){
  #app{display:block}
  #side{position:static;width:auto;height:auto}
  nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px}
  nav button{width:auto}
  nav .sub{width:100%;margin:0;border:0;padding:0}
  nav .sub.open{display:flex;flex-wrap:wrap}
  .brand{padding:16px}
  .brand em{display:none}
  main{padding:16px 14px 60px}
  .grid2,.ucols,.result,.big3{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .ft td.h{display:none}
  .list b{flex-basis:110px}
}
@media print{
  #side,#gate,#tip,#fxbar,#sumbar,#browserwarn,.add,.del,.cta,.steps button{display:none!important}
  main{padding:0}
  body{background:#fff;font-size:11px}
  .scroll{overflow:visible;border:0}
  .wt{min-width:0;font-size:9px}
  .wt .lbl{position:static}
  .wt td.num,.wt th.num{width:6%}
  .in{padding:2px 3px}
  .card,.hero{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<style id="pgsize">@page{size:A4 portrait;margin:10mm}</style>
</head>

"use strict";
/* Eerst de onbewerkte broncode vastleggen: dit is wat de downloadknop als bestand opslaat. */
var SOURCE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

//<engine>
/* Rekenkern. FORMULAS bevat de formules 1-op-1 uit "Jaarplan 2027 v1.0.xlsx"
   (U = 02 Uurtarief, J = 03 Jaarplan, M = 04 Maandanalyse), met de Excel-celadressen als sleutel. */
var MCOLS = "DEFGHIJKLMNO".split("");
var MSHORT = ["Jan","Feb","Mrt","Apr","Mei","Jun","Jul","Aug","Sep","Okt","Nov","Dec"];
/* Groepen waaraan regels toegevoegd kunnen worden. Een optelling die de hele groep omvat
   (bijv. SUM(D33:D36)) telt de toegevoegde regels automatisch mee. */
var GROUPS = {
  dienst:{s:"J",first:22,last:29}, dk:{s:"J",first:33,last:36},
  oh1:{s:"J",first:44,last:49}, oh2:{s:"J",first:52,last:53}, oh3:{s:"J",first:56,last:60},
  oh4:{s:"J",first:63,last:71}, oh5:{s:"J",first:74,last:78}, oh6:{s:"J",first:81,last:91},
  oh7:{s:"J",first:94,last:94}, prive:{s:"J",first:101,last:106},
  bk:{s:"U",first:13,last:24}, ndu:{s:"U",first:26,last:30}
};
function createEngine(F, st){
  var SHEETS = {"03 Jaarplan":"J","02 Uurtarief":"U","04 Maandanalyse":"M"};
  var REF = /(?:'([^']+)'!)?\$?([A-Z]{1,2})\$?(\d+)(?::\$?([A-Z]{1,2})\$?(\d+))?/g;
  var fns = {}, cache = {};
  function colN(c){ var n=0; for(var i=0;i<c.length;i++) n=n*26+c.charCodeAt(i)-64; return n; }
  function colS(n){ var s=""; while(n>0){ var m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26; } return s; }
  function compile(k){
    var sheet = k.charAt(0);
    var js = String(F[k]).replace(/(\d+(?:\.\d+)?)%/g,"($1/100)").replace(REF,function(m,sh,c1,r1,c2,r2){
      var s = sh ? SHEETS[sh] : sheet;
      return c2 ? 'rng("'+s+'","'+c1+'",'+r1+',"'+c2+'",'+r2+')' : 'g("'+s+"!"+c1+r1+'")';
    }).replace(/SUM\(/g,"sum(");
    return new Function("g","rng","sum","return "+js+";");
  }
  function sum(){ var t=0; for(var i=0;i<arguments.length;i++){ var a=arguments[i]; if(Array.isArray(a)){ for(var j=0;j<a.length;j++) t+=a[j]; } else t+=a; } return t; }
  function rows(g){ return (st.rows && st.rows[g]) || []; }
  function xval(g,id,col){
    if(g==="dienst") return get("J!="+col+"#"+id);
    if(GROUPS[g].s==="U") return get("U!"+col+"#"+id);
    return col==="P" ? get("J!=P#"+id) : get("J!"+col+"#"+id);
  }
  function rng(s,c1,r1,c2,r2){
    var out=[], a=colN(c1), b=colN(c2);
    for(var c=a;c<=b;c++) for(var r=r1;r<=r2;r++) out.push(get(s+"!"+colS(c)+r));
    if(c1===c2){
      for(var g in GROUPS){ var G=GROUPS[g];
        if(G.s===s && r1<=G.first && G.last<=r2){ var ids=rows(g); for(var i=0;i<ids.length;i++) out.push(xval(g,ids[i],c1)); }
      }
    }
    return out;
  }
  /* Berekende waarden van toegevoegde regels: J!=D#dienst-1 (omzet per maand), J!=P#... (rijtotaal), J!=Q#... (totaal aantal) */
  function xcalc(k){
    var m = /^J!=([A-Z])#(([a-z0-9]+)-\d+)$/.exec(k); if(!m) return 0;
    var col=m[1], id=m[2], g=m[3], t=0, i;
    if(g==="dienst"){
      var price = get("J!C#"+id);
      if(col==="Q"){ for(i=0;i<12;i++) t+=get("J!"+MCOLS[i]+"#"+id); return t; }
      if(col==="P"){ for(i=0;i<12;i++) t+=price*get("J!"+MCOLS[i]+"#"+id); return t; }
      return price*get("J!"+col+"#"+id);
    }
    if(col==="P"){ for(i=0;i<12;i++) t+=get("J!"+MCOLS[i]+"#"+id); return t; }
    return 0;
  }
  /* 04 Maandanalyse F109:F112 = SUM(D16:INDEX(D16:O16,1,MATCH(E13,D15:O15,0))) -> cumulatief t/m gekozen maand */
  var CUM = {"M!F109":16,"M!F110":17,"M!F111":18,"M!F112":19};
  function cum(row){
    var n = MSHORT.indexOf(st.v["M!E13"] || "Jan"); if(n<0) n=0;
    var t=0; for(var i=0;i<=n;i++) t+=get("M!"+MCOLS[i]+row); return t;
  }
  /* Privéregels (Belasting t/m Winst): vast totaal/12, plus eventuele correcties (+/-) per maand (st.adj).
     Correcties in jan t/m nov worden verrekend in december; een correctie in december zit in het totaal zelf. */
  function priv(p){
    var tk = "J!P"+p.r, A = st.adj || {};
    var tot = (typeof st.v[tk]==="number" || (st.f && st.f[tk])) ? get(tk) : 0;
    if(p.c==="O"){ var t=0; for(var i=0;i<11;i++) t+=get("J!"+MCOLS[i]+p.r); return tot - t; }
    return (tot - (A["J!O"+p.r]||0))/12 + (A["J!"+p.c+p.r]||0);
  }
  var busy={}, errs={};
  function formula(k){
    if(k in cache) return cache[k];
    var r=0;
    if(st.f && typeof st.f[k]==="string"){ // eigen formule in een invoercel
      if(busy[k]){ errs[k]=1; return NaN; } // kringverwijzing
      busy[k]=1; try { r=userEval(st.f[k], get); } catch(e){ r=NaN; } delete busy[k];
      if(typeof r!=="number" || !isFinite(r)){ r=NaN; errs[k]=1; }
    }
    else if(k.indexOf("=")>0) r=xcalc(k);
    else if(CUM[k]) r=cum(CUM[k]);
    else if(privInfo(k)) r=priv(privInfo(k));
    else if(F[k]!==undefined){ r=(fns[k]||(fns[k]=compile(k)))(get,rng,sum); }
    cache[k]=r; return r;
  }
  function get(k){ var u=st.v[k]; return (typeof u==="number" && !(st.f && st.f[k])) ? u : formula(k); }
  return { get:get, formula:formula, reset:function(){ cache={}; errs={}; busy={}; }, err:function(k){ return !!errs[k]; } };
}

   De cursist kiest één keer een .json-bestand. Daarna wordt na elke wijziging automatisch daarin
   opgeslagen, en bij het openen van de tool wordt het bestand weer ingeladen (het nieuwste wint).
   Browsers die dit niet kunnen (Safari, Firefox) houden de knoppen Exporteer/Importeer gegevens. */
var FS_OK = typeof window.showSaveFilePicker==="function" && typeof window.showOpenFilePicker==="function" && window.isSecureContext!==false && typeof indexedDB!=="undefined";
try { if(window.self!==window.top) FS_OK = false; } catch(e){ FS_OK = false; }
var fh = null, fsState = "none", fsLast = "", fsChain = Promise.resolve(), fsPending = false;
var FS_TYPES = [{description:"Jaarplan-gegevens", accept:{"application/json":[".json"]}}];
function idbDo(mode, fn){
  return new Promise(function(res, rej){
    var r = indexedDB.open("jaarplan2027", 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore("kv"); };
    r.onerror = function(){ rej(r.error); };
    r.onsuccess = function(){ var db = r.result, tx = db.transaction("kv", mode), q = fn(tx.objectStore("kv"));
      tx.oncomplete = function(){ db.close(); res(q && q.result); }; tx.onerror = function(){ db.close(); rej(tx.error); }; };
  });
}
function fsRemember(h){ return idbDo("readwrite", function(o){ return o.put(h, "file:"+SKEY); }).catch(function(){}); }
function fsRecall(){ return idbDo("readonly", function(o){ return o.get("file:"+SKEY); }); }
function nowHM(){ return new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"}); }
function fileText(){ return JSON.stringify({ app:"jaarplan2027", versie:1, opgeslagen:new Date().toISOString(), state:st }, null, 1); }
function hasData(){ var d = defaults(), k;
  for(k in st.v) if(st.v[k]!==d.v[k]) return true;
  for(k in st.rows) if(st.rows[k] && st.rows[k].length) return true;
  return false; }
function applyState(s){
  st = s; if(!st.rows) st.rows = {}; if(!st.f) st.f = {};
  eng = createEngine(FORMULAS, st); layDirty();
  try { localStorage.setItem(SKEY, JSON.stringify(st)); } catch(e){}
  go(route.join("/"), true);
}
/* Schrijf de huidige gegevens naar het opslagbestand (nooit twee keer tegelijk). */
function fsWrite(){
  if(!fh || fsState!=="ok") return;
  if(fsPending) return; fsPending = true;
  fsChain = fsChain.then(function(){
    fsPending = false; var text = fileText();
    return fh.createWritable().then(function(w){ return w.write(text).then(function(){ return w.close(); }); });
  }).then(function(){ fsLast = nowHM(); saveMsg(false); }, function(e){
    fsPending = false; fsState = (e && (e.name==="NotAllowedError" || e.name==="SecurityError")) ? "ask" : "error"; saveMsg(false);
  });
}
function readFsFile(h){
  return h.getFile().then(function(f){ return f.text(); }).then(function(text){
    var raw = null; try { raw = JSON.parse(text); } catch(e){}
    if(!String(text).trim()) return {empty:true};
    if(!raw || raw.app!=="jaarplan2027") return {bad:true};
    var s = readImport(text); if(!s) return {bad:true};
    s.t = (raw.state && raw.state.t) || 0; return {state:s};
  });
}
/* Gekoppeld bestand inladen: het nieuwste (browser of bestand) wint; daarna staat alles gelijk. */
function fsLoad(){
  return readFsFile(fh).then(function(r){
    if(r.bad){ fsState = "error"; saveMsg(false); return; }
    fsState = "ok";
    if(r.state && (r.state.t||0) > (st.t||0)){ applyState(r.state); fsLast = nowHM(); saveMsg(false); }
    else fsWrite();
  }).catch(function(e){ fsState = (e && e.name==="NotAllowedError") ? "ask" : "error"; saveMsg(false); });
}
function fsInit(){
  if(!FS_OK) return;
  fsRecall().then(function(h){
    if(!h || !h.queryPermission) return;
    fh = h;
    return h.queryPermission({mode:"readwrite"}).then(function(p){
      if(p==="granted") return fsLoad();
      fsState = "ask"; saveMsg(false);
    });
  }).catch(function(){});
}
function fsAllow(){
  if(!fh) return;
  fh.requestPermission({mode:"readwrite"}).then(function(p){
    if(p==="granted") fsLoad(); else { fsState = "ask"; saveMsg(false); }
  }).catch(function(){ fsState = "error"; saveMsg(false); });
}
function fsNew(){
  window.showSaveFilePicker({ suggestedName:"Jaarplan-2027-gegevens.json", types:FS_TYPES }).then(function(h){
    fh = h; fsState = "ok"; if(!st.t) st.t = Date.now();
    fsRemember(h); fsWrite(); saveMsg(false);
  }).catch(function(e){ if(!(e && e.name==="AbortError")) alert("Het opslagbestand kon niet worden aangemaakt. Probeer het opnieuw of kies een andere map."); });
}
function fsOpen(){
  var picked = null;
  window.showOpenFilePicker({ types:FS_TYPES, multiple:false }).then(function(a){
    picked = a[0];
    return picked.requestPermission({mode:"readwrite"}).then(function(p){
      if(p!=="granted") throw {name:"Denied"};
      return readFsFile(picked);
    });
  }).then(function(r){
    if(r.bad) return alert("Dit is geen opslagbestand van het Jaarplan. Kies het .json-bestand dat de tool eerder voor je heeft gemaakt.");
    if(r.state && hasData() && !confirm("Gegevens uit ‘"+picked.name+"’ laden? Wat nu in deze browser is ingevuld, wordt vervangen door de gegevens uit dit bestand.")) return;
    fh = picked; fsState = "ok"; fsRemember(picked);
    if(r.state){ if(!r.state.t) r.state.t = Date.now(); applyState(r.state); fsLast = nowHM(); saveMsg(false); }
    else fsWrite();
  }).catch(function(e){
    if(e && e.name==="AbortError") return;
    if(e && e.name==="Denied") return alert("Zonder toestemming kan de tool niet in dit bestand opslaan. Probeer het opnieuw en kies ‘Wijzigingen opslaan’ of ‘Toestaan’.");
    alert("Het bestand kon niet worden geopend.");
  });
}

function parseNum(s){
  s = String(s).trim().replace(/[€\s%]/g,""); if(!s) return undefined;
  if(s.indexOf(",")>=0) s = s.replace(/\./g,"").replace(",",".");
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
  var n = parseFloat(s); return isFinite(n) ? n : undefined;
}
function nl(v,d){ return v.toLocaleString("nl-NL",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmt(v,f){
  if(typeof v!=="number" || !isFinite(v)) return "–";
  if(f==="eur2") return (v<0?"-":"")+"€ "+nl(Math.abs(v),2);
  if(Math.abs(v)<0.005) return "–";
  if(f==="eur0") return (v<0?"-":"")+"€ "+nl(Math.abs(v),0);
  if(f==="dec1") return nl(v, Math.abs(v-Math.round(v))<0.05 ? 0 : 1);
  return nl(v,0);
}
function fmtIn(v,f){
  if(typeof v!=="number") return "";
  if(f==="pct") return nl(v*100, 0)+"%";
  if(f==="eur2") return nl(v,2);
  return v.toLocaleString("nl-NL",{maximumFractionDigits:2});
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

LB.prototype.put = function(col,row,o){ o.col=col; o.c=colNum(col); o.r=row; o.a=col+row; o.s=this.s; this.at[o.a]=o; if(o.k) this.of[o.k]=o; this.list.push(o); return o; };

function removeRow(g, id){
  var filled = Object.keys(st.v).concat(Object.keys(st.f||{})).some(function(k){ return k.slice(-id.length-1)==="#"+id && (st.v[k]!=="" || (st.f && st.f[k])); });
  if(filled && !confirm("In deze regel is al iets ingevuld. Wil je de regel toch verwijderen?")) return;
  st.rows[g] = (st.rows[g]||[]).filter(function(x){ return x!==id; });
  Object.keys(st.v).forEach(function(k){ if(k.slice(-id.length-1)==="#"+id) delete st.v[k]; });
  Object.keys(st.f||{}).forEach(function(k){ if(k.slice(-id.length-1)==="#"+id) delete st.f[k]; });
  layDirty(); save(); go(route.join("/"), true);
}

/* ---------- gebeurtenissen ---------- */
view.addEventListener("input", function(e){
  var t = e.target, k;
  if((k = t.getAttribute("data-k"))){
    t._ref = null;
    if(t.value.trim().charAt(0)==="="){ hlRefs(t); showFx(k, t.value); return; } // formule: pas uitrekenen bij Enter
    if(st.f && st.f[k]){ delete st.f[k]; t.classList.remove("fx","err"); }
    clearHl(); showFx(k, null);
    var n = parseNum(t.value);
    if(n!==undefined && t.getAttribute("data-f")==="pct") n = n/100;
    if(n===undefined) delete st.v[k]; else st.v[k] = n;
  } else if((k = t.getAttribute("data-t"))){
    if(t.value==="" && !LABELS[k]) delete st.v[k]; else st.v[k] = t.value;
    t._edit = true; // in tekstvakjes verplaatsen links/rechts na het typen de cursor
    if(t.tagName==="TEXTAREA") grow(t);
  } else if((k = t.getAttribute("data-sel"))){ st.v[k] = t.value; }
  else return;
  save(); recalc();
});
view.addEventListener("change", function(e){ var k = e.target.getAttribute("data-sel"); if(k){ st.v[k] = e.target.value; save(); recalc(); } });
/* ---------- privémaanden: aanpassen met + of - ----------
   +200 of -300 telt op bij het huidige bedrag. Jan t/m nov wordt verrekend in december;
   een aanpassing in december verandert het totaal. Leegmaken wist de aanpassing van die maand. */
function commitAdj(t){
  var k = t.getAttribute("data-adj"), s = t.value.trim(); t._edit = false;
  if(s===t._orig) return;
  var p = privInfo(k), A = st.adj || (st.adj = {}), old = A[k] || 0, tk = "J!P"+p.r, d;
  if(s===""){ d = -old; }
  else {
    var m = /^([+\-−])\s*(.+)$/.exec(s), n = m ? parseNum(m[2]) : parseNum(s);
    if(n===undefined){ t.value = t._orig; showFx(k, "Typ + of - en een bedrag, bijvoorbeeld +200 of -300"); return; }
    d = m ? (m[1]==="+" ? n : -n) : n - eng.get(k); // zonder teken: het nieuwe bedrag van deze maand
  }
  if(!d) return;
  A[k] = Math.round((old + d)*100)/100; if(!A[k]) delete A[k];
  if(p.c==="O"){ st.v[tk] = Math.round(((typeof st.v[tk]==="number" ? st.v[tk] : 0) + d)*100)/100; delete st.f[tk];
    var ti = view.querySelector('input[data-k="'+tk+'"]'); if(ti) ti.value = cellText(tk, "eur0"); }
  save(); recalc();
}
view.addEventListener("focusin", function(e){
  var t = e.target, k = t.getAttribute && t.getAttribute("data-adj"); if(!k) return;
  t._orig = t.value; t._edit = false;
  if(sel.anchor!==k && !drag){ sel = {anchor:k, ranges:[[k,k]]}; paintSel(); updateSum(); }
  showFx(k); setTimeout(function(){ try{ if(document.activeElement===t && t.value===t._orig) t.select(); }catch(x){} },0);
});
view.addEventListener("focusout", function(e){ var t = e.target; if(t.getAttribute && t.getAttribute("data-adj")){ commitAdj(t); t.value = fmt(eng.get(t.getAttribute("data-adj")),"eur0"); } });
view.addEventListener("focusout", function(e){
  var t = e.target, k = t.getAttribute && t.getAttribute("data-k"); if(!k) return;
  commitCell(t); clearHl(); t._ref = null;
  t.value = cellText(k, t.getAttribute("data-f"));
});
view.addEventListener("focusin", function(e){
  var t = e.target, k = t.getAttribute && t.getAttribute("data-k");
  t._edit = false;
  if(!k) return;
  if(sel.anchor!==k && cellOf(k) && !drag){ sel = {anchor:k, ranges:[[k,k]]}; paintSel(); updateSum(); } // ook bij verplaatsen met pijltjes/Tab
  if(st.f && st.f[k]) t.value = "="+toDisplay(st.f[k], k.charAt(0)); // de formule zelf tonen zolang je op de cel staat
  t._orig = t.value; t._sv = st.v[k]; t._sf = st.f && st.f[k]; t._ref = null;
  showFx(k); if(st.f && st.f[k]) hlRefs(t);
  if(t.select) setTimeout(function(){ try{ if(document.activeElement===t && !t._ref && t.value===t._orig) t.select(); }catch(x){} },0);
});
/* ---------- toetsenbord zoals in Excel ----------
   Pijltjes = naar het vakje erboven/eronder/links/rechts. F2 (of dubbelklik) = de inhoud bewerken, dan verplaatsen
   links/rechts de cursor. Tijdens het typen van een formule (=...) verplaatsen links/rechts ook de cursor.
   F4 = celverwijzing vastzetten met $. Shift+pijltje = selectie uitbreiden. Enter = vakje eronder. */
function navEls(){ return Array.prototype.filter.call(view.querySelectorAll("input[data-k], input.tx[data-t], input[data-adj]"), function(el){ return el.offsetParent!==null; }); }
function navFind(r0, dir, list, rectOf){
  var cx = (r0.left+r0.right)/2, best = null, bd = Infinity;
  list.forEach(function(it){
    var r = rectOf(it); if(!r.width && !r.height) return;
    var d;
    if(dir==="up" || dir==="down"){
      if(!(r.left < r0.right-1 && r.right > r0.left+1)) return;
      var dy = dir==="down" ? r.top - r0.bottom : r0.top - r.bottom; if(dy < -3) return;
      d = dy*1000 + Math.abs((r.left+r.right)/2 - cx);
    } else {
      if(!(r.top < r0.bottom-1 && r.bottom > r0.top+1)) return;
      var dx = dir==="right" ? r.left - r0.right : r0.left - r.right; if(dx < -3) return;
      d = dx;
    }
    if(d < bd){ bd = d; best = it; }
  });
  return best;
}
function moveTo(el){
  el.focus({preventScroll:true});
  try{ el.scrollIntoView({block:"nearest", inline:"nearest"}); }catch(x){}
}
function isEditing(t){ return !!t._edit || (t.hasAttribute("data-k") && t.value.trim().charAt(0)==="=" && t.value!==t._orig); }
function extendSel(dir){
  if(!sel.anchor) return;
  var last = sel.ranges.length ? sel.ranges[sel.ranges.length-1] : [sel.anchor, sel.anchor], td = cellTd[last[1]]; if(!td) return;
  var keys = Object.keys(cellTd).filter(function(k){ return cellTd[k].offsetParent!==null; });
  var nk = navFind(td.getBoundingClientRect(), dir, keys, function(k){ return cellTd[k].getBoundingClientRect(); }); if(!nk) return;
  if(!sel.ranges.length) sel.ranges = [[sel.anchor, nk]]; else sel.ranges[sel.ranges.length-1] = [last[0], nk];
  paintSel(); updateSum();
  try{ cellTd[nk].scrollIntoView({block:"nearest", inline:"nearest"}); }catch(x){}
}
/* F4: wisselt de verwijzing bij de cursor: D5 -> $D$5 -> D$5 -> $D5 -> D5 (ook voor een reeks D5:D10). */
function toggleAbs(t){
  var v = t.value, p = t.selectionStart, re = /(\$?)([A-Za-z]{1,2})(\$?)(\d+)(?::(\$?)([A-Za-z]{1,2})(\$?)(\d+))?/g, m, hit = null;
  while((m = re.exec(v))){
    var s = m.index, e = s+m[0].length;
    if(/[A-Za-z0-9_.,]/.test(v.charAt(s-1)) || /[A-Za-z0-9_(]/.test(v.charAt(e))) continue;
    if(s <= p && p <= e){ hit = m; break; }
    if(e <= p) hit = m;
  }
  if(!hit) return;
  var fl = (hit[1]?1:0)|(hit[3]?2:0), nf = {0:3,3:2,2:1,1:0}[fl];
  function part(c,r){ return (nf&1?"$":"")+c+(nf&2?"$":"")+r; }
  var txt = part(hit[2],hit[4])+(hit[6] ? ":"+part(hit[6],hit[8]) : ""), s0 = hit.index, ne = s0+txt.length;
  t.value = v.slice(0,s0)+txt+v.slice(s0+hit[0].length);
  try{ t.setSelectionRange(ne, ne); }catch(x){}
  t._ref = {s:s0, e:ne}; if(t.id==="fxin") syncFx(t); hlRefs(t); showFx(kOf(t), t.value);
}
view.addEventListener("dblclick", function(e){ var t = e.target; if(t.tagName==="INPUT" && (t.hasAttribute("data-k") || t.hasAttribute("data-t"))) t._edit = true; });
view.addEventListener("keydown", function(e){
  var t = e.target; if(!t.getAttribute || t.tagName!=="INPUT") return;
  var k = t.getAttribute("data-k"); if(!k && !t.hasAttribute("data-t") && !t.hasAttribute("data-adj")) return;
  if(t.hasAttribute("data-adj") && e.key==="Escape"){ t.value = t._orig; t._edit = false; try{ t.select(); }catch(x){} return; }
  if(e.key==="F4"){ e.preventDefault(); if(k && t.value.trim().charAt(0)==="=") toggleAbs(t); return; }
  if(e.key==="F2"){ e.preventDefault(); t._edit = true; var n = t.value.length; try{ t.setSelectionRange(n, n); }catch(x){} return; }
  if(k && e.key==="Escape" && t._orig!==undefined){ // Esc = wijziging ongedaan maken
    if(t._sv===undefined) delete st.v[k]; else st.v[k] = t._sv;
    if(t._sf) st.f[k] = t._sf; else if(st.f) delete st.f[k];
    t.value = t._orig; t._edit = false; clearHl(); save(); recalc(); showFx(k); try{ t.select(); }catch(x){}
    return;
  }
  if(e.key==="Enter"){
    e.preventDefault(); if(k) commitCell(t);
    var nx = navFind(t.getBoundingClientRect(), e.shiftKey ? "up" : "down", navEls().filter(function(x){ return x!==t; }), function(x){ return x.getBoundingClientRect(); });
    if(nx) moveTo(nx); else t.blur();
    return;
  }
  var dir = {ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"}[e.key];
  if(!dir || e.altKey || e.ctrlKey || e.metaKey) return;
  if(e.shiftKey){ if(!isEditing(t) && k){ e.preventDefault(); extendSel(dir); } return; }
  if(isEditing(t) && (dir==="left" || dir==="right")) return; // cursor verplaatsen binnen het vakje
  e.preventDefault();
  var to = navFind(t.getBoundingClientRect(), dir, navEls().filter(function(x){ return x!==t; }), function(x){ return x.getBoundingClientRect(); });
  if(to) moveTo(to);
});

/* ---------- kopiëren, plakken en doorvoeren (Ctrl+C / Ctrl+V / Ctrl+R / Ctrl+D) ----------
   Formules worden net als in Excel 'meeverschoven': D5 wordt E5 als je één vakje naar rechts plakt;
   met $ vastgezette delen ($D$5) blijven staan. */
var CLIP = null, copied = [];
function activeKey(){ var a = document.activeElement; return a && view.contains(a) && a.getAttribute && a.getAttribute("data-k"); }
function selRect(){
  var last = sel.ranges.length ? sel.ranges[sel.ranges.length-1] : null, ak = activeKey();
  if(!last && ak) last = [ak, ak];
  return last ? rangeKeys(last[0], last[1], true) : null;
}
function entryOf(cell){
  var k = cell.k;
  if(st.f && st.f[k]) return {f:st.f[k], s:cell.s, c:cell.c, r:cell.r};
  if(cell.kind==="in" && typeof st.v[k]==="number") return {v:st.v[k], s:cell.s, c:cell.c, r:cell.r};
  if(cell.kind==="in" && FORMULAS[k]===undefined) return {s:cell.s, c:cell.c, r:cell.r}; // leeg vakje
  var v = eng.get(k); return {v: isFinite(v) ? v : undefined, s:cell.s, c:cell.c, r:cell.r};
}
function shiftStore(store, dr, dc){
  if(store.indexOf("#ERR:")===0) return store;
  return store.replace(/\{([^}|]+)(?:\|(\d))?\}/g, function(all, key, ab){
    ab = +ab || 0; var s, c, r, m;
    if(key.charAt(0)==="?"){ m = /^\?([A-Z])!([A-Z]{1,2})(\d+)$/.exec(key); if(!m) return all; s = m[1]; c = colNum(m[2]); r = +m[3]; }
    else { var x = cellOf(key); if(!x) return all; s = x.s; c = x.c; r = x.r; }
    var nc = ab&1 ? c : c+dc, nr = ab&2 ? r : r+dr;
    if(nc < 1 || nr < 1) return "{?"+s+"!#}";
    var addr = colStr(nc)+nr, y = LAY()[s] && LAY()[s].at[addr];
    return "{"+(y && y.k && (y.kind==="in" || y.kind==="calc") ? y.k : "?"+s+"!"+addr)+(ab ? "|"+ab : "")+"}";
  });
}
function putEntry(cell, en){ // en = bron; cell = doelvakje (alleen lichtblauwe vakjes)
  if(!cell || cell.kind!=="in") return false;
  var k = cell.k; if(!st.f) st.f = {};
  if(en.f){ st.f[k] = shiftStore(en.f, cell.r-en.r, cell.c-en.c); delete st.v[k]; }
  else if(typeof en.v==="number"){ st.v[k] = Math.round(en.v*100)/100; delete st.f[k]; }
  else { delete st.v[k]; delete st.f[k]; }
  return true;
}
function afterPaste(keys){
  layDirty(); save(); recalc();
  keys.forEach(function(k){ var el = view.querySelector('input[data-k="'+k+'"]'); if(el){ el.value = cellText(k, el.getAttribute("data-f")); if(el===document.activeElement){ el._orig = el.value; el._sv = st.v[k]; el._sf = st.f[k]; } } });
  recalc(); var ak = activeKey(); if(ak) showFx(ak);
}
function markCopied(keys){ copied.forEach(function(td){ td.classList.remove("copied"); }); copied = []; keys.forEach(function(k){ var td = cellTd[k]; if(td){ td.classList.add("copied"); copied.push(td); } }); }
function numTxt(v){ return typeof v==="number" && isFinite(v) ? String(Math.round(v*100)/100).replace(".",",") : ""; }
function canGrid(){ var a = document.activeElement; if(a && view.contains(a) && a.tagName==="INPUT" && a.hasAttribute("data-k")) return !isEditing(a); return !!sel.anchor && !(a && (a.tagName==="INPUT" || a.tagName==="TEXTAREA") && a!==document.body); }
document.addEventListener("copy", function(e){
  if(!canGrid()) return;
  var R = selRect(); if(!R) return;
  var L = LAY()[R.s], rows = [], text = [], keys = [];
  for(var r=R.r1;r<=R.r2;r++){ var row = [], tr = [];
    for(var c=R.c1;c<=R.c2;c++){ var x = L.at[colStr(c)+r];
      if(x && x.k && (x.kind==="in" || x.kind==="calc")){ var en = entryOf(x); row.push(en); tr.push(numTxt(en.f ? eng.get(x.k) : en.v)); keys.push(x.k); }
      else { row.push(null); tr.push(""); } }
    rows.push(row); text.push(tr.join("\t")); }
  CLIP = {rows:rows, text:text.join("\n")};
  e.clipboardData.setData("text/plain", CLIP.text); e.preventDefault(); markCopied(keys);
});
document.addEventListener("paste", function(e){
  if(!canGrid()) return;
  var R = selRect(); if(!R) return;
  var text = (e.clipboardData && e.clipboardData.getData("text/plain")) || "", src;
  if(CLIP && text.replace(/\r/g,"").replace(/\n$/,"")===CLIP.text) src = CLIP.rows;
  else { // van buiten de tool (bijv. uit Excel): alleen getallen
    src = text.replace(/\r/g,"").replace(/\n$/,"").split("\n").map(function(line){ return line.split("\t").map(function(s){ var n = parseNum(s); return n===undefined ? (s.trim() ? null : {}) : {v:n}; }); });
  }
  if(!src.length || !src[0].length) return;
  e.preventDefault();
  var L = LAY()[R.s], h = src.length, w = src[0].length, H = R.r2-R.r1+1, W = R.c2-R.c1+1;
  var tile = (H % h===0 && W % w===0) ? 1 : 0, rh = tile ? H : h, rw = tile ? W : w, done = [];
  for(var i=0;i<rh;i++) for(var j=0;j<rw;j++){
    var en = src[i % h] && src[i % h][j % w]; if(!en) continue;
    var cell = L.at[colStr(R.c1+j)+(R.r1+i)];
    if(cell && en.c===undefined) en = {v:en.v, c:cell.c, r:cell.r};
    if(putEntry(cell, en)) done.push(cell.k);
  }
  if(done.length) afterPaste(done);
});
function fillDir(down){ // Ctrl+D = doorvoeren naar beneden, Ctrl+R = doorvoeren naar rechts
  var R = selRect(); if(!R) return;
  var L = LAY()[R.s], done = [], i, j, src, cell;
  if(R.r1===R.r2 && R.c1===R.c2){ if(down) R.r1--; else R.c1--; } // één vakje: neem het vakje erboven / links ervan
  if(down) for(j=R.c1;j<=R.c2;j++){ src = L.at[colStr(j)+R.r1]; if(!src || !src.k) continue; var en = entryOf(src); for(i=R.r1+1;i<=R.r2;i++){ cell = L.at[colStr(j)+i]; if(putEntry(cell, en)) done.push(cell.k); } }
  else for(i=R.r1;i<=R.r2;i++){ src = L.at[colStr(R.c1)+i]; if(!src || !src.k) continue; var en2 = entryOf(src); for(j=R.c1+1;j<=R.c2;j++){ cell = L.at[colStr(j)+i]; if(putEntry(cell, en2)) done.push(cell.k); } }
  if(done.length) afterPaste(done);
}
document.addEventListener("keydown", function(e){
  if(e.defaultPrevented || !canGrid()) return;
  var key = e.key.toLowerCase();
  if((e.ctrlKey || e.metaKey) && !e.altKey && (key==="d" || key==="r")){ e.preventDefault(); fillDir(key==="d"); return; }
  if((e.key==="Delete" || e.key==="Backspace") && selKeys().length > 1){ // meerdere vakjes leegmaken
    e.preventDefault(); var done = [];
    selKeys().forEach(function(k){ var c = cellOf(k); if(c && c.kind==="in"){ delete st.v[k]; if(st.f) delete st.f[k]; done.push(k); } });
    if(done.length) afterPaste(done); return;
  }
  var dir = {ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"}[e.key];
  if(dir && !activeKey() && sel.anchor && cellTd[sel.anchor] && !e.ctrlKey && !e.metaKey && !e.altKey){ // vanuit een beige rekenvakje
    e.preventDefault();
    if(e.shiftKey) return extendSel(dir);
    var to = navFind(cellTd[sel.anchor].getBoundingClientRect(), dir, navEls(), function(x){ return x.getBoundingClientRect(); });
    if(to) moveTo(to);
  }
});
document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-go],[data-act],[data-add],[data-del],[data-dellast],[data-print]") : null; if(!t) return;
  var g;
  if(t.hasAttribute("data-go")) return go(t.getAttribute("data-go"));
  if((g = t.getAttribute("data-add"))){
    st.n = (st.n||0)+1; var id = g+"-"+st.n; (st.rows[g] = st.rows[g]||[]).push(id);
    layDirty(); save(); go(route.join("/"), true);
    var f = view.querySelector('[data-t$="#'+id+'"]'); if(f) f.focus();
    return;
  }
  if((g = t.getAttribute("data-del"))) return removeRow(g, t.getAttribute("data-id"));
  if((g = t.getAttribute("data-dellast"))){ var ids = rowsOf(g); if(ids.length) removeRow(g, ids[ids.length-1]); return; }
  if((g = t.getAttribute("data-print"))) return printPage(g);
  var a = t.getAttribute("data-act");
  if(a==="printmenu") return togglePrintMenu();
  if(a==="fsnew") fsNew();
  if(a==="fsopen") fsOpen();
  if(a==="fsallow") fsAllow();
  if(a==="hidewarn"){ try { sessionStorage.setItem("jaarplan2027:browserwarn","1"); } catch(x){} var w = document.getElementById("browserwarn"); if(w) w.remove(); }
  if(a==="wipe" && confirm("Weet je zeker dat je alles wilt wissen? Alle ingevulde gegevens worden verwijderd, ook uit je opslagbestand. Dit kan niet ongedaan worden gemaakt.")){
    st = defaults(); eng = createEngine(FORMULAS, st); layDirty(); save(); go(route.join("/"));
  }
  if(a==="download") download();
  if(a==="copysum") copySum();
  if(a==="clearsel") clearSel();
  if(a==="export") exportData();
  if(a==="import") importData();
});
window.addEventListener("hashchange", function(){ if(location.hash.slice(1)!==route.join("/")) go(location.hash); });

/* ---------- afdrukken per pagina ---------- */
function togglePrintMenu(force){
  var m = document.getElementById("printmenu"), b = document.querySelector('[data-act="printmenu"]');
  var open = typeof force==="boolean" ? force : m.hidden;
  m.hidden = !open; if(b) b.setAttribute("aria-expanded", open ? "true" : "false");
  if(open && m.scrollIntoView) m.scrollIntoView({block:"nearest"});
}
document.addEventListener("click", function(e){
  var m = document.getElementById("printmenu");
  if(!m.hidden && !(e.target.closest && e.target.closest('#printmenu,[data-act="printmenu"]'))) togglePrintMenu(false);
});
function setPageSize(p){
  var s = document.getElementById("pgsize");
  if(s) s.textContent = "@page{size:A4 "+((p==="jaarplan"||p==="maandanalyse") ? "landscape" : "portrait")+";margin:10mm}";
}
function printPage(p){
  togglePrintMenu(false);
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  go(p);
  setPageSize(p);
  setTimeout(function(){ window.print(); }, 150);
}

/* ---------- downloaden als HTML ---------- */
function download(){
  flush();
  var html = buildHtml(Date.now().toString(36)+Math.random().toString(36).slice(2,7));
  saveFile("Jaarplan-2027-Bertha-Baas.html", html, "text/html;charset=utf-8");
}

/* ---------- gegevens exporteren / importeren ---------- */
function saveFile(name, text, type){
  var url = URL.createObjectURL(new Blob([text], {type:type}));
  var l = document.createElement("a"); l.href = url; l.download = name;
  document.body.appendChild(l); l.click(); l.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function exportData(){
  flush();
  var d = new Date(), p = function(n){ return (n<10?"0":"")+n; };
  var stamp = d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
  saveFile("Jaarplan-2027-gegevens-"+stamp+".json", JSON.stringify({ app:"jaarplan2027", versie:1, geexporteerd:d.toISOString(), state:st }, null, 1), "application/json");

/* Leest een exportbestand (.json) of een eerder gedownloade kopie van de tool (.html). */
